[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdr-pedido"
version = "0.2.0"
description = "Interpretação auditável de pedidos de gráfica em arquivos CorelDRAW CDR"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "pedrsilva3515" }]
dependencies = []

[project.scripts]
cdr-pedido = "zcfreader.cli:main"

[tool.setuptools]
package-dir = { "" = "fase3-parser" }
packages = ["zcfreader"]
